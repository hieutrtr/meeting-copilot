[package]
name = "stt-mlx"
version = "1.0.0"
description = "Meeting Copilot STT adapter — Phase 1 T-1.5 (MLX whisper subprocess + FakeStt behind SttProvider trait)."
edition = "2021"
rust-version = "1.77"

[lib]
name = "stt_mlx"
path = "src/lib.rs"

[features]
default = ["mlx-runtime", "deepgram", "elevenlabs"]
# Compiles the MLX subprocess module + tests. Disable for headless CI where Python
# is not installed; the trait + FakeStt remain available.
mlx-runtime = []
# Phase 3 T-3.2 — compiles the Deepgram WebSocket adapter (sync `tungstenite`).
# Plain `ws://` only; TLS (wss://) lands alongside the live test-connection button (T-3.6).
deepgram = ["dep:tungstenite"]
# Phase 3 T-3.4 — compiles the ElevenLabs Scribe streaming WebSocket adapter. Independent
# of `deepgram`: enabling either pulls in `tungstenite`. Both adapters share the
# `providers::backoff::BackoffConfig` type (always compiled, no transport deps).
elevenlabs = ["dep:tungstenite"]
# Phase 3 T-3.7 — compiles the TTS trait + ElevenLabs TTS adapter. Default OFF
# per ARCH §4 ("V1 không bật TTS mặc định"). Pulls in zero new dependencies — the
# adapter is transport-injected (`TtsTransport` trait); a future Phase 3.x patch wires
# `reqwest::blocking::Client` behind the same flag once live HTTP is required.
tts = []

[dependencies]
audio-capture = { path = "../audio-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hound = "3.5"
tungstenite = { version = "0.21", optional = true, default-features = false, features = ["handshake"] }
