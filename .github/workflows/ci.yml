# Phase 0 CI placeholder. Frontend-only (Vite build) until Rust toolchain
# lights up post-T-0.8. Phase 1 (T-1.13) extends with cargo build + DMG sign.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend build (Vite)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build

  rust:
    name: Rust check (Tauri)
    runs-on: macos-14
    # Phase 0 keeps this disabled — flip to needs: [frontend] in T-1.1.
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
