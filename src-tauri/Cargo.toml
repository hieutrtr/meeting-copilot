[package]
name = "meeting-copilot"
version = "1.0.1"
description = "Meeting Copilot — Phase 0 scaffold (T-0.8)"
authors = ["Meeting Copilot dev"]
edition = "2021"
rust-version = "1.77"

# Phase 1 T-1.2 — workspace member; profile sections moved to root virtual workspace.
# Member crates per ARCH App A: crates/helper-daemon (here), crates/audio-capture (T-1.3),
# crates/stt-mlx (T-1.5).

[lib]
name = "meeting_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
helper-daemon = { path = "../crates/helper-daemon" }
# T-W.7 — Tauri command wrappers in `src/commands/setup.rs` need direct access
# to the wizard's typed enums (`BlackHoleStatus`, `VerifyReport`, `ConfigureError`)
# so the IPC DTOs can be built from `From<...>` conversions without round-
# tripping through helper-daemon. Production probes/runners/creators are
# constructed inside the commands (RealCoreAudioProbe / RealAggregateDeviceCreator
# / RealAudioInputProbe / RealFilesystem / RealProcessRunner).
audio-capture = { path = "../crates/audio-capture" }
