[package]
name = "meeting-copilot"
version = "0.0.0"
description = "Meeting Copilot — Phase 0 scaffold (T-0.8)"
authors = ["Meeting Copilot dev"]
edition = "2021"
rust-version = "1.77"

# Phase 0 scaffold only — Phase 1 splits crates per ARCH App A:
#   crates/audio-capture, crates/stt-mlx, crates/helper-daemon

[lib]
name = "meeting_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
